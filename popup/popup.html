<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools for Tester</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app-container">

    <header class="app-header">
      <span class="app-logo" aria-hidden="true">🧰</span>
      <div>
        <h1 class="app-title">Tools Tester</h1>
        <span class="app-subtitle">QA &amp; Dev toolkit</span>
      </div>
      <span class="app-version">v4.5</span>
    </header>

    <main class="tool-scroll">
      <div class="tool-menu">

        <!-- Voice Recorder -->
        <div class="tool-item accent-rose">
          <button id="btn-voice-recorder" class="premium-btn" aria-expanded="false"
            aria-controls="result-voice-recorder">
            <span class="icon" aria-hidden="true">🎤</span>
            <span class="label">Voice Recorder</span>
            <span class="chev" aria-hidden="true"></span>
          </button>
          <div id="result-voice-recorder" class="tool-result hidden">
            <div class="sub-list">
              <button id="btn-voice-mic" class="sub-btn">
                <span class="sub-icon" aria-hidden="true">🎙️</span>
                <span>
                  <span class="sub-title">อัดเฉพาะเสียงไมค์</span>
                  <span class="sub-desc">บันทึกเสียงจากไมโครโฟน</span>
                </span>
              </button>

              <button id="btn-voice-desktop" class="sub-btn">
                <span class="sub-icon" aria-hidden="true">🖥️</span>
                <span>
                  <span class="sub-title">อัดเสียงจากระบบ</span>
                  <span class="sub-desc">บันทึกเสียงระบบ + ไมค์</span>
                </span>
              </button>
            </div>
          </div>
        </div>

        <!-- Screenshot -->
        <div class="tool-item tool-item-row accent-indigo">
          <button id="btn-screenshot" class="premium-btn" aria-expanded="false" aria-controls="result-screenshot">
            <span class="icon" aria-hidden="true">📸</span>
            <span class="label">Screenshot</span>
            <span class="chev" aria-hidden="true"></span>
          </button>
          <button id="btn-quick-screenshot" class="side-control" title="Quick Snap — แคปหน้าจอที่เห็นทันที">
            <span class="quick-pill" aria-hidden="true">Quick</span>
            <span class="side-label">Snap</span>
          </button>
          <div id="result-screenshot" class="tool-result hidden">
            <div class="sub-list">
              <button id="btn-crop-screenshot" class="sub-btn">
                <span class="sub-icon" aria-hidden="true">✂️</span>
                <span>
                  <span class="sub-title">Crop Screenshot</span>
                  <span class="sub-desc">ลากกรอบแล้วแคป</span>
                </span>
              </button>

              <button id="btn-browser-screenshot" class="sub-btn">
                <span class="sub-icon" aria-hidden="true">🌐</span>
                <span>
                  <span class="sub-title">Screenshot (Browser)</span>
                  <span class="sub-desc">แคปหน้าต่าง browser</span>
                </span>
              </button>

              <button id="btn-fullpage-screenshot" class="sub-btn">
                <span class="sub-icon" aria-hidden="true">📄</span>
                <span>
                  <span class="sub-title">Full Page Screenshot</span>
                  <span class="sub-desc">แคปทั้งหน้าเว็บ (scroll)</span>
                </span>
              </button>
            </div>
          </div>
        </div>

        <!-- Font Scanner -->
        <div class="tool-item accent-amber">
          <button id="btn-font-scanner" class="premium-btn" aria-expanded="false" aria-controls="result-font-scanner">
            <span class="icon" aria-hidden="true">📝</span>
            <span class="label">Font Scanner</span>
            <span class="chev" aria-hidden="true"></span>
          </button>
          <div id="result-font-scanner" class="tool-result hidden"></div>
        </div>

        <!-- Element Inspector -->
        <div class="tool-item accent-sky">
          <button id="btn-inspector" class="premium-btn">
            <span class="icon" aria-hidden="true">🔍</span>
            <span class="label">Element Inspector</span>
            <span class="go" aria-hidden="true">→</span>
          </button>
        </div>

        <!-- Locator Recorder -->
        <div class="tool-item accent-violet">
          <button id="btn-locator-recorder" class="premium-btn" aria-expanded="false"
            aria-controls="result-locator-recorder">
            <span class="icon" aria-hidden="true">🎯</span>
            <span class="label">Locator Recorder</span>
            <span class="chev" aria-hidden="true"></span>
          </button>
          <div id="result-locator-recorder" class="tool-result hidden">
            <div class="sub-list">
              <button id="btn-locator-start" class="sub-btn">
                <span class="sub-icon" aria-hidden="true">⏺️</span>
                <span>
                  <span class="sub-title">Start / Stop Recording</span>
                  <span class="sub-desc">คลิก element เพื่อเก็บ locator</span>
                </span>
              </button>

              <button id="btn-locator-clear" class="sub-btn">
                <span class="sub-icon" aria-hidden="true">🗑️</span>
                <span>
                  <span class="sub-title">Clear Records</span>
                  <span class="sub-desc" id="locator-count-label">ล้าง locator ที่เก็บไว้ทั้งหมด</span>
                </span>
              </button>
            </div>
          </div>
        </div>

        <!-- Color Picker -->
        <div class="tool-item accent-pink">
          <button id="btn-color-picker" class="premium-btn" aria-expanded="false" aria-controls="result-color-picker">
            <span class="icon" aria-hidden="true">🎨</span>
            <span class="label">Color Picker</span>
            <span class="chev" aria-hidden="true"></span>
          </button>
          <div id="result-color-picker" class="tool-result hidden"></div>
        </div>

        <!-- Responsive Viewer -->
        <div class="tool-item accent-teal">
          <button id="btn-responsive" class="premium-btn">
            <span class="icon" aria-hidden="true">📱</span>
            <span class="label">Responsive Viewer</span>
            <span class="go" aria-hidden="true">→</span>
          </button>
        </div>

        <!-- Clear Cache -->
        <div class="tool-item accent-orange">
          <button id="btn-clear-cache" class="premium-btn" aria-expanded="false" aria-controls="result-clear-cache">
            <span class="icon" aria-hidden="true">🧹</span>
            <span class="label">Clear Cache</span>
            <span class="chev" aria-hidden="true"></span>
          </button>
          <div id="result-clear-cache" class="tool-result hidden"></div>
        </div>

        <!-- Live Editor -->
        <div class="tool-item accent-green">
          <button id="btn-live-editor" class="premium-btn">
            <span class="icon" aria-hidden="true">✏️</span>
            <span class="label">Live Editor</span>
            <span class="go" aria-hidden="true">→</span>
          </button>
        </div>

        <!-- API Monitor -->
        <div class="tool-item tool-item-row accent-blue">
          <button id="btn-api-monitor" class="premium-btn">
            <span class="icon" aria-hidden="true">📡</span>
            <span class="label">API Monitor</span>
            <span class="go" aria-hidden="true">→</span>
          </button>
          <label class="side-control" title="เปิด API Monitor ค้างไว้แม้จะ reload หน้า">
            <span class="toggle">
              <input type="checkbox" id="chk-persistence" aria-label="Keep API Monitor active after reload">
              <span class="toggle-track"></span>
              <span class="toggle-thumb"></span>
            </span>
            <span class="side-label">Always On</span>
          </label>
        </div>

      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>

</html>
